[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratecurves"
version = "0.0.1"
description = "Multi-curve EUR rate curves (€STR / EURIBOR 6M) and swap pricer, validated against QuantLib"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
test = ["pytest", "QuantLib"]
demo = ["streamlit"]
report = ["matplotlib", "QuantLib"]

[tool.setuptools]
packages = ["ratecurves"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
